<!DOCTYPE html>
<html lang="en" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In · Antigravity Console</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <style>
        :root {
            --space-950: #09090b;
            --space-900: #0f0f11;
            --space-800: #18181b;
            --space-border: #27272a;
            --neon-purple: #a855f7;
            --neon-cyan: #06b6d4;
            --neon-red: #ef4444;
            --text-primary: #ffffff;
            --text-secondary: #d4d4d8;
            --text-tertiary: #a1a1aa;
            --text-muted: #71717a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
        }

        body {
            background: var(--space-950);
            color: var(--text-secondary);
            font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1.5rem;
            position: relative;
            overflow: hidden;
        }

        /* Ambient background glow */
        body::before,
        body::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.18;
            pointer-events: none;
            z-index: 0;
        }

        body::before {
            width: 480px;
            height: 480px;
            background: var(--neon-purple);
            top: -140px;
            left: -120px;
        }

        body::after {
            width: 420px;
            height: 420px;
            background: var(--neon-cyan);
            bottom: -160px;
            right: -120px;
        }

        .card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 400px;
            background: linear-gradient(135deg, rgba(15, 15, 17, 0.85) 0%, rgba(18, 18, 20, 0.8) 100%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 0.9rem;
            padding: 2.25rem 2rem;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.02) inset, 0 12px 48px rgba(0, 0, 0, 0.55);
            animation: fadeIn 0.4s ease-out both;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1.75rem;
        }

        .brand-logo {
            width: 40px;
            height: 40px;
            border-radius: 0.5rem;
            background: linear-gradient(135deg, var(--neon-purple) 0%, #2563eb 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #fff;
            box-shadow: 0 0 18px rgba(168, 85, 247, 0.45);
            flex-shrink: 0;
        }

        .brand-text {
            display: flex;
            flex-direction: column;
            line-height: 1.2;
        }

        .brand-title {
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            color: var(--text-primary);
        }

        .brand-sub {
            font-size: 0.65rem;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            letter-spacing: 0.12em;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        h1 {
            font-size: 1.35rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.4rem;
        }

        .subtitle {
            font-size: 0.85rem;
            color: var(--text-tertiary);
            margin-bottom: 1.75rem;
        }

        .field {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            font-size: 0.72rem;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-tertiary);
            margin-bottom: 0.5rem;
        }

        .input-wrap {
            position: relative;
        }

        input[type="password"],
        input[type="text"] {
            width: 100%;
            background: rgba(9, 9, 11, 0.6);
            border: 1px solid rgba(39, 39, 42, 0.8);
            color: var(--text-primary);
            border-radius: 0.55rem;
            padding: 0.7rem 2.6rem 0.7rem 0.85rem;
            font-size: 0.9rem;
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }

        input::placeholder {
            color: var(--text-muted);
        }

        input:focus {
            border-color: rgba(168, 85, 247, 0.6);
            background: rgba(24, 24, 27, 0.8);
            box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.12);
        }

        .toggle-visibility {
            position: absolute;
            right: 0.5rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 0.35rem;
            display: flex;
            align-items: center;
            border-radius: 0.35rem;
            transition: color 0.2s ease;
        }

        .toggle-visibility:hover {
            color: var(--neon-cyan);
        }

        button.submit {
            width: 100%;
            margin-top: 0.5rem;
            padding: 0.75rem 1rem;
            border: none;
            border-radius: 0.55rem;
            font-size: 0.9rem;
            font-weight: 600;
            color: #fff;
            cursor: pointer;
            background: linear-gradient(90deg, var(--neon-purple) 0%, #6366f1 100%);
            box-shadow: 0 6px 20px rgba(168, 85, 247, 0.25);
            transition: box-shadow 0.2s ease, transform 0.05s ease, opacity 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        button.submit:hover:not(:disabled) {
            box-shadow: 0 8px 28px rgba(168, 85, 247, 0.4);
        }

        button.submit:active:not(:disabled) {
            transform: translateY(1px);
        }

        button.submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error {
            display: none;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
            padding: 0.6rem 0.75rem;
            font-size: 0.8rem;
            color: #fca5a5;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 0.5rem;
        }

        .error.show {
            display: flex;
            animation: fadeIn 0.2s ease-out both;
        }

        .footer {
            margin-top: 1.75rem;
            text-align: center;
            font-size: 0.7rem;
            color: var(--text-muted);
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255, 255, 255, 0.35);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        [hidden] {
            display: none !important;
        }
    </style>
</head>

<body>
    <main class="card" role="main">
        <div class="brand">
            <div class="brand-logo">AG</div>
            <div class="brand-text">
                <span class="brand-title">ANTIGRAVITY</span>
                <span class="brand-sub">Claude Proxy System</span>
            </div>
        </div>

        <h1>Sign in</h1>
        <p class="subtitle">Enter the dashboard password to continue.</p>

        <div class="error" id="error" role="alert">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span id="error-text">Invalid password</span>
        </div>

        <form id="login-form" autocomplete="off" novalidate>
            <div class="field">
                <label for="password">Password</label>
                <div class="input-wrap">
                    <input type="password" id="password" name="password" placeholder="••••••••" autofocus
                        autocomplete="current-password" aria-describedby="error-text" />
                    <button type="button" class="toggle-visibility" id="toggle" aria-label="Show password">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="2" aria-hidden="true" id="eye-icon">
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            <path stroke-linecap="round" stroke-linejoin="round"
                                d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                        </svg>
                    </button>
                </div>
            </div>

            <button type="submit" class="submit" id="submit">
                <span id="submit-label">Unlock Dashboard</span>
                <span class="spinner" id="spinner" hidden></span>
            </button>
        </form>

        <div class="footer">SECURE ACCESS · WEBUI</div>
    </main>

    <script src="login.js"></script>
</body>

</html>
